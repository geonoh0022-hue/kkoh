<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 반 기록장 · 로그인</title><style>body{font-family:system-ui;background:#f3f6fa;color:#172b43;margin:0;display:grid;place-items:center;min-height:100dvh}main{background:white;padding:32px;border-radius:18px;width:min(360px,calc(100% - 88px));box-shadow:0 12px 40px #142d5010}h1{font-size:25px}p{line-height:1.7;color:#65768c}label{display:block;margin:20px 0 7px}input,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd6e4;border-radius:9px;font:inherit}button{margin-top:24px;background:#255dcc;color:white;cursor:pointer}#error{color:#b33240}</style><main><h1>우리 반 기록장</h1><p>나만 사용하는 학생 관리 공간<br>설정한 계정으로 로그인해 주세요.</p><form id="login"><label for="username">아이디</label><input id="username" autocomplete="username" required value="admin"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">로그인</button><p id="error" role="alert"></p></form></main><script src="/login.js" defer></script></html>
